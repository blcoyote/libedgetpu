name: Build Debian packages

# Cross-compiles libedgetpu for arm64 inside a Debian container for each
# supported Raspberry Pi OS base (Bookworm = Debian 12, Trixie = Debian 13)
# and packages it as .deb files named <package>.<distro>_arm64.deb.
#
# Run manually from the Actions tab, or push a tag (e.g. 16.0tf2.19.1-1) to
# also publish the packages as a GitHub release.

on:
  workflow_dispatch:
  push:
    tags:
      - "16.*"

permissions:
  contents: read

jobs:
  build:
    name: libedgetpu (${{ matrix.distro }}, arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        distro: [bookworm, trixie]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y devscripts debhelper fakeroot dpkg-dev

      - name: Build libedgetpu for aarch64 in Docker
        run: |
          DOCKER_CPUS="aarch64" \
          DOCKER_IMAGE="debian:${{ matrix.distro }}" \
          DOCKER_TARGETS=libedgetpu \
          make docker-build

      - name: Package .deb files
        run: |
          dpkg-buildpackage -rfakeroot -us -uc -tc -b -a arm64 -d
          mkdir -p dist
          for f in ../*_arm64.deb; do
            mv "$f" "dist/$(basename "$f" _arm64.deb).${{ matrix.distro }}_arm64.deb"
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.distro }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --repo "$GITHUB_REPOSITORY" --generate-notes
